<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posture Pro - 姿態辨識與離線監控系統</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #121212; --panel: #1e1e1e; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #333;
            border-top: 5px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        nav { width: 100%; background: var(--panel); padding: 10px; display: flex; justify-content: center; gap: 20px; border-bottom: 1px solid #333; }
        nav .brand { color: var(--primary); font-weight: bold; font-size: 1.2em; }
        
        .container { width: 95%; max-width: 1000px; margin-top: 20px; }
        .ui-panel { background: var(--panel); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #333; position: relative; }
        
        button { background: #333; color: white; border: 1px solid #555; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #444; }
        button.primary { border-color: var(--primary); color: var(--primary); }

        #camera-section { text-align: center; }
        #output-canvas { width: 100%; max-width: 640px; background: #000; border-radius: 8px; border: 2px solid #333; }
        
        .status-bar { display: flex; justify-content: space-around; font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }
        .score-good { color: var(--primary); }
        .score-bad { color: #ff4444; }

        #history-container { width: 100%; height: 200px; overflow-x: auto; background: #000; margin-top: 10px; border: 1px solid #333; position: relative; }
        #history-canvas { display: block; height: 100%; }
        #stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; text-align: center; }
        .stat-card { background: #252525; padding: 10px; border-radius: 4px; }
        .stat-card small { color: #888; display: block; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">正在初始化系統...</div>
</div>

<nav>
    <div class="brand">Posture Pro 即時監控中心</div>
</nav>

<div id="camera-section" class="container">
    <div class="ui-panel">
        <button id="connectBle">連接 micro:bit (BLE)</button>
        <button id="connectUsb">連接 micro:bit (USB)</button>
        <span id="conn-status" style="margin-left:10px; color:#888;">狀態: 未連線</span>
        <button id="switchCamera" style="float:right;">切換鏡頭</button>
    </div>

    <canvas id="output-canvas"></canvas>

    <div class="ui-panel">
        <div class="status-bar">
            <span>角度分數: <span id="angle-score">0.0°</span></span>
            <span>綜合信心值: <span id="total-confidence">0.00</span></span>
            <span id="posture-status">等待偵測...</span>
        </div>
        
        <div style="margin: 15px 0;">
            <button id="calibrateBtn" class="primary">校正標準姿勢</button>
            <button id="resetThresholdBtn">重設門檻 (0.5)</button>
            <button id="downloadCsv">匯出紀錄 (CSV)</button>
            <button id="clearLog">清除紀錄</button>
            <label style="margin-left:15px;"><input type="checkbox" id="showLandmarks" checked> 顯示特徵點</label>
            <label style="margin-left:15px;"><input type="checkbox" id="enableAudio"> 音效提示</label>
        </div>

        <div class="threshold-ui">
            <label>系統靈敏度 (門檻值 T): <span id="threshold-val">0.50</span></label>
            <input type="range" id="threshold-slider" min="0" max="1" step="0.01" value="0.5" style="width:100%;">
        </div>

        <div id="history-container">
            <canvas id="history-canvas" height="200"></canvas>
        </div>
        <div id="stats-grid">
            <div class="stat-card"><small>正常次數</small><span id="goodCount">0</span></div>
            <div class="stat-card"><small>駝背次數</small><span id="badCount" style="color:#ff4444;">0</span></div>
            <div class="stat-card"><small>總紀錄</small><span id="totalCount">0</span></div>
            <div class="stat-card"><small>駝背比例</small><span id="badRatio">0%</span></div>
        </div>
    </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
