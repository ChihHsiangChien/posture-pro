<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景：圓角深色背景 -->
  <rect width="512" height="512" rx="100" fill="#121212"/>
  
  <!-- 核心圖案：修正後的高位肩膀比例 -->
  <g stroke="#00ff88" fill="none" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- 頭部 -->
    <circle cx="256" cy="115" r="45" fill="#00ff88" stroke="none"/>
    
    <!-- 垂直脊椎 (從頭部底緣開始) -->
    <path d="M256 160 L256 420"/>
    
    <!-- 肩膀線 (大幅上移，緊貼頭部) -->
    <!-- y 座標從 190 移至 175 -->
    <path d="M150 175 C 200 165, 312 165, 362 175"/>
    
    <!-- 腰部指示線 (維持在下方提供穩定感) -->
    <path d="M190 400 H322" stroke="#00ff88" stroke-width="10" opacity="0.2"/>
  </g>
  
  <!-- 裝飾：姿態偵測掃描線 -->
  <path d="M80 260 H432" stroke="#00ff88" stroke-width="3" stroke-dasharray="10 15" opacity="0.3"/>
</svg>
