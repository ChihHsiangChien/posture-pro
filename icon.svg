<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景：圓角深色背景 -->
  <rect width="512" height="512" rx="100" fill="#121212"/>
  
  <!-- 核心圖案：健康脊椎示意 -->
  <g stroke="#00ff88" fill="none" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- 頭部 -->
    <circle cx="256" cy="130" r="45" fill="#00ff88" stroke="none"/>
    <!-- 垂直脊椎 -->
    <path d="M256 195 L256 420"/>
    <!-- 對稱肩膀線 -->
    <path d="M150 250 C 200 220, 312 220, 362 250"/>
  </g>
  
  <!-- 裝飾：姿態掃描線 -->
  <path d="M100 320 H412" stroke="#00ff88" stroke-width="6" stroke-dasharray="12 12" opacity="0.4"/>
</svg>
