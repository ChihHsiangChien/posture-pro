<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圓形 -->
  <circle cx="256" cy="256" r="240" fill="#121212" stroke="#333" stroke-width="10"/>
  
  <!-- 抽象的人體與脊椎 -->
  <g fill="none" stroke="#00ff88" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">
    <!-- 頭部 -->
    <circle cx="256" cy="140" r="40" fill="#00ff88" stroke="none"/>
    <!-- 脊椎/背部 (直線代表端正) -->
    <path d="M256 200 L256 420"/>
    <!-- 肩膀 -->
    <path d="M180 230 Q256 210 332 230"/>
  </g>
  
  <!-- 裝飾元素：掃描線感 -->
  <path d="M150 280 L362 280" stroke="#00ff88" stroke-width="5" stroke-dasharray="10 10" opacity="0.5"/>
</svg>
